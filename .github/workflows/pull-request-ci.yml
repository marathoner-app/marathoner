name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  production-dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Record dependency inventory client version
        run: npm --version

      - name: Create production dependency inventory
        run: |
          npm query '.prod' --package-lock-only > production-dependencies.json
          node scripts/create-production-osv-inventory.mjs production-dependencies.json production-dependencies.osv-scanner.json

      - name: Reject production dependency advisories
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=osv-scanner:production-dependencies.osv-scanner.json

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

  track-mobile-viewport:
    name: Track mobile viewport
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise Track at phone width
        run: npm run test:viewport

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
        env:
          VITE_FIREBASE_ENVIRONMENT: development

  ios-boundary:
    name: iOS boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, sync, and inspect the unsigned iOS boundary
        run: npm run check:ios
        env:
          VITE_FIREBASE_ENVIRONMENT: development
          VITE_FIREBASE_IOS_API_KEY: ci-non-live-ios-key
          VITE_FIREBASE_NATIVE_APP_CHECK_DEBUG: true

      - name: Build, sync, and inspect explicit beta iOS selection
        run: npm run check:ios:beta
        env:
          VITE_FIREBASE_ENVIRONMENT: beta
          VITE_FIREBASE_IOS_API_KEY: ci-non-live-beta-ios-key

  firestore-tests:
    name: Firestore emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('package-lock.json', 'firebase.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules and persistence tests
        run: npm run test:firestore

  material-command-tests:
    name: Material command emulators
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: material-command-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json', 'firebase.json', 'functions/package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Prove the authenticated material-command boundary
        run: npm run test:material-commands
