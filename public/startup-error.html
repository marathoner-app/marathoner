<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marathoner could not start</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #fff;
        color: #000;
      }

      main {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 2rem;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 3.5rem;
        line-height: 1;
      }

      p {
        max-width: 32rem;
        margin: 1.5rem 0 0;
        color: #454545;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        color: #1d4ed8;
        font-weight: 650;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Marathoner.</h1>
      <p role="alert">
        Marathoner could not start. Close and reopen the app, or try reloading.
      </p>
      <a href="./">Reload Marathoner</a>
    </main>
  </body>
</html>
